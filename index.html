<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="description" content="Inquilab — a non-lethal action chronicle of Bhagat Singh, 1928–1931." />
  <link rel="icon" href="data:,">
  <title>Inquilab</title>
  <link rel="preload" as="image" href="./src/art/bg/title.webp" fetchpriority="high" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="loading">
    <p class="loading-title">INQUILAB</p>
    <p id="loading-msg">Loading…</p>
  </div>
  <div id="stage">
    <div id="frame">
      <canvas id="game" width="960" height="540" aria-label="Inquilab"></canvas>
      <div id="touch">
        <div id="stick" hidden>
          <div id="stick-base"></div>
          <div id="stick-knob"></div>
        </div>
        <div class="actions">
          <button type="button" data-hold="act" id="btn-act" class="act-dash">Dash</button>
          <button type="button" data-hold="jump" class="act-jump">Jump</button>
          <button type="button" data-hold="dodge" class="act-dodge">Dodge</button>
          <button type="button" data-hold="atk" class="act-atk">Attack</button>
        </div>
        <p id="turn-hint">Turn sideways</p>
        <button type="button" id="btn-pause" aria-label="Pause">II</button>
        <button type="button" id="btn-continue">Continue</button>
      </div>
      <p id="chapter-wait" hidden>Loading this chapter…</p>
      <div id="title-ui">
        <button type="button" id="btn-begin">Begin</button>
        <button type="button" id="btn-chapters">Chapters</button>
      </div>
      <div id="chapter-ui" hidden></div>
      <div id="pause-ui" hidden>
        <p class="banner">PAUSED</p>
        <button type="button" id="btn-resume">Resume</button>
        <button type="button" id="btn-retry">Retry checkpoint</button>
        <button type="button" id="btn-level-select">Level select</button>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
